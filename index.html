<script type="module">
import * as T from "three";
const canvas=document.querySelector("#scene"),fallback=document.querySelector("#fallback");let renderer;

renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;
const scene=new T.Scene(),camera=new T.PerspectiveCamera(32,innerWidth/innerHeight,.1,80);camera.position.set(0,1.25,7.3);
scene.add(new T.HemisphereLight(0xf5e8ff,0x21172b,2));const key=new T.DirectionalLight(0xffd9e8,3);key.position.set(-3,5,5);scene.add(key);const rim=new T.PointLight(0x9b83ff,22,12);rim.position.set(3,2.5,-2);scene.add(rim);
const M=(c,r=.55,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m}),skin=M("#f1c6b8"),hair=M("#211827",.38),hair2=M("#493047"),dress=M("#33253e",.4),dress2=M("#9e789e"),eyeWhite=M("#fff5f3"),iris=M("#7860a8",.25),black=M("#1b1420"),lip=M("#a94f72"),gold=M("#cba46f",.3,.6);

function rod(p,ma,a,b,r){const d=new T.Vector3(...b).sub(new T.Vector3(...a)),o=new T.Mesh(new T.CapsuleGeometry(r,Math.max(.01,d.length()-2*r),5,10),ma);o.position.copy(new T.Vector3(...a).add(new T.Vector3(...b)).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());p.add(o);return o}
const body=new T.Group();model.add(body);sphere(body,skin,[0,1.02,0],[.38,.5,.24]);sphere(body,dress,[0,.1,0],[.59,.77,.32]);sphere(body,dress2,[0,.48,.02],[.42,.15,.32]);const skirt=new T.Mesh(new T.ConeGeometry(.72,1.08,40),dress);skirt.position.set(0,-.48,0);skirt.scale.z=.55;body.add(skirt);
rod(body,skin,[-.17,-.7,0],[-.19,-1.25,0],.12);rod(body,skin,[.17,-.7,0],[.19,-1.25,0],.12);sphere(body,black,[-.19,-1.3,.1],[.17,.09,.25]);sphere(body,black,[.19,-1.3,.1],[.17,.09,.25]);
const armL=new T.Group(),armR=new T.Group();armL.position.set(-.42,.55,0);armR.position.set(.42,.55,0);body.add(armL,armR);rod(armL,skin,[0,0,0],[-.18,-.45,.02],.11);rod(armL,skin,[-.18,-.45,.02],[-.12,-.8,.08],.1);sphere(armL,skin,[-.12,-.86,.08],[.11,.13,.1]);rod(armR,skin,[0,0,0],[.18,-.45,.02],.11);rod(armR,skin,[.18,-.45,.02],[.12,-.8,.08],.1);sphere(armR,skin,[.12,-.86,.08],[.11,.13,.1]);
const neck=new T.Mesh(new T.CylinderGeometry(.12,.14,.3,20),skin);neck.position.set(0,1.47,0);body.add(neck);

const eyes=[];for(const x of [-.21,.21]){const e=new T.Group();e.position.set(x,.07,.405);head.add(e);sphere(e,eyeWhite,[0,0,0],[.12,.16,.05]);sphere(e,iris,[0,0,.045],[.07,.09,.028]);sphere(e,black,[0,0,.067],[.036,.06,.017]);sphere(e,eyeWhite,[-.025,.04,.082],[.02,.024,.01]);eyes.push(e);rod(e,hair,[-.14,.18,0],[-.02,.2,0],.022);}
sphere(head,skin,[0,-.13,.43],[.04,.06,.035]);const mouth=sphere(head,lip,[0,-.34,.42],[.09,.022,.02]);sphere(head,gold,[-.49,-.42,.1],[.035,.08,.035]);sphere(head,gold,[.49,-.42,.1],[.035,.08,.035]);
const halo=new T.Mesh(new T.TorusGeometry(1.1,.008,8,80),new T.MeshBasicMaterial({color:0xa98ce8,transparent:true,opacity:.38}));halo.position.set(0,1.2,-.5);halo.rotation.x=Math.PI/2;model.add(halo);

let yaw=0,drag=false,last=0,px=0,py=0,waveTo=0,turn=null,voice=false;canvas.addEventListener("pointerdown",e=>{drag=true;last=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener("pointermove",e=>{px=(e.clientX/innerWidth-.5)*2;py=(e.clientY/innerHeight-.5)*2;if(drag&&!turn){yaw+=(e.clientX-last)*.009;last=e.clientX}});canvas.addEventListener("pointerup",()=>drag=false);canvas.addEventListener("pointercancel",()=>drag=false);
function toast(s){const e=document.querySelector("#toast");e.textContent=s;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1500)}
function expr(v){mouth.scale.set(.09,v==="happy"?.045:v==="surprised"?.055:.022,v==="surprised"?.045:.02);mouth.position.y=v==="happy"?-.31:v==="surprised"?-.36:-.34;head.rotation.z=v==="curious"?.12:0}

document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>action(b.dataset.a));
const clock=new T.Clock();function frame(now){requestAnimationFrame(frame);const t=clock.getElapsedTime();if(turn){const p=Math.min(1,(now-turn.start)/1650);root.rotation.y=turn.from+p*Math.PI*2;if(p===1){turn=null;yaw=0}}else root.rotation.y+=(yaw-root.rotation.y)*.075;body.position.y=Math.sin(t*1.7)*.035;head.rotation.y+=(px*.22-head.rotation.y)*.04;head.rotation.x+=(-py*.08-head.rotation.x)*.04;const blink=Math.pow(Math.max(0,Math.sin(t*.72+1.5)),45);eyes.forEach(e=>e.scale.y=1-blink*.88);armR.rotation.z=now<waveTo?Math.sin(t*13)*.52-.5:armR.rotation.z*.9;particles.rotation.y=t*.035;halo.rotation.z=t*.18;renderer.render(scene,camera)}requestAnimationFrame(frame);

const messages=document.querySelector("#messages");function add(s,user=false){const d=document.createElement("div");d.className="msg"+(user?" user":"");d.textContent=s;messages.append(d);messages.scrollTop=messages.scrollHeight}

function answer(q){const s=q.toLowerCase();if(/hello|hi|hey|هلو|مرحبا/.test(s))return"Hello! I'm happy you're here. Want me to wave or turn around?";if(/turn|rotate|دور|استدير/.test(s)){action("turn");return"A full turn, coming right up!";}if(/sad|tired|حزين|تعبان/.test(s))return"Take a little breath. You don't have to do everything at once. 🌷";if(/name|اسمك/.test(s))return"You can call me Muse. I'm your digital character.";if(/beautiful|pretty|جميلة|حلوة/.test(s))return"That's sweet of you. Thank you! ✨";return"I'm listening. This version uses local scripted replies, and I can also wave, change expressions and rotate."}
